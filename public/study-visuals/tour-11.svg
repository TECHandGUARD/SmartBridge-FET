<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Build a responsible itinerary</title><desc id="desc">Illustrative one-night trip for two people. Transport shared, one vehicle, R600. Room shared, one night, R800. Activity per person, R120 × 2, R240. Meals per person, R150 × 2, R300</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">TOURISM  /  GRADE 11</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Build a responsible itinerary</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><text x="20" y="39" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Transport</text><rect x="160" y="19" width="243.75" height="30" rx="13" fill="url(#forest)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="510" y="41" font-size="17" fill="#193e36" text-anchor="start" font-weight="normal">R600</text><text x="20" y="104" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Room</text><rect x="160" y="84" width="325.0" height="30" rx="13" fill="#3c718c" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="510" y="106" font-size="17" fill="#193e36" text-anchor="start" font-weight="normal">R800</text><text x="20" y="169" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Activity × 2</text><rect x="160" y="149" width="97.5" height="30" rx="13" fill="url(#forest)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="510" y="171" font-size="17" fill="#193e36" text-anchor="start" font-weight="normal">R240</text><text x="20" y="234" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Meals × 2</text><rect x="160" y="214" width="121.875" height="30" rx="13" fill="#3c718c" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="510" y="236" font-size="17" fill="#193e36" text-anchor="start" font-weight="normal">R300</text><rect x="15" y="281" width="610" height="44" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="35" y="309" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Total for two people</text><text x="602" y="311" font-size="23" fill="#193e36" text-anchor="end" font-weight="bold">R1 940</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
 <text x="40" y="506" font-size="10" fill="#52675e" text-anchor="start" font-weight="bold">SMARTBRIDGE FET</text>
