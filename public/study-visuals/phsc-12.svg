<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Momentum and collisions</title><desc id="desc">Before: a 2 kilogram trolley moves right at 3 metres per second toward a stationary 1 kilogram trolley. After they stick together: the combined 3 kilograms move right at 2 metres per second.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">PHYSICAL SCIENCES  /  GRADE 12</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Momentum and collisions</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><text x="28" y="30" font-size="15" fill="#193e36" text-anchor="start" font-weight="normal">BEFORE</text><rect x="35" y="80" width="140" height="70" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="105" y="122" font-size="23" fill="#193e36" text-anchor="middle" font-weight="normal">2 kg</text><path d="M180,110 L265,110" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="257.10175694298664,114.31482984743782 265,110 257.10175694298664,105.68517015256218" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="217" y="88" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">3 m/s</text><rect x="365" y="80" width="100" height="70" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="415" y="122" font-size="23" fill="#193e36" text-anchor="middle" font-weight="normal">1 kg</text><text x="415" y="175" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">at rest</text><text x="28" y="220" font-size="15" fill="#193e36" text-anchor="start" font-weight="normal">AFTER: STUCK TOGETHER</text><rect x="180" y="235" width="235" height="65" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="297" y="275" font-size="23" fill="#193e36" text-anchor="middle" font-weight="normal">3 kg</text><path d="M425,267 L550,267" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="542.1017569429866,271.3148298474378 550,267 542.1017569429866,262.6851701525622" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="487" y="245" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">2 m/s</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
