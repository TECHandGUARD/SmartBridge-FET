<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Compare tariffs fairly</title><desc id="desc">At 8 GB, illustrative plan A costs R130 and plan B R160. Bars start at the same baseline; plan B is longer because it costs R30 more.</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="25" y="30" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Illustrative tariffs · same usage</text><text x="25" y="80" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">A at 8 GB</text><rect x="25" y="94" width="357.5" height="39" rx="12" fill="#2d8068"/><text x="480" y="120" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">130</text><text x="25" y="180" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">B at 8 GB</text><rect x="25" y="194" width="440.0" height="39" rx="12" fill="#386a98"/><text x="480" y="220" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">160</text><text x="25" y="305" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Compare the same measure, period and units.</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 11 · Mathematical Literacy</text></g></svg>