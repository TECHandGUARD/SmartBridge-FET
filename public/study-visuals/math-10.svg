<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Factorise, solve, check</title><desc id="desc">x squared minus 5x plus 6 equals zero becomes (x minus 2)(x minus 3) equals zero. Arrows split to the roots x equals 2 and x equals 3.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">MATHEMATICS  /  GRADE 10</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Factorise, solve, check</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><rect x="130" y="15" width="380" height="64" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="320" y="55" font-size="24" fill="#193e36" text-anchor="middle" font-weight="normal">x² − 5x + 6 = 0</text><path d="M320,85 L320,115" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="315.6851701525622,107.10175694298664 320,115 324.3148298474378,107.10175694298664" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="130" y="120" width="380" height="64" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="320" y="160" font-size="24" fill="#193e36" text-anchor="middle" font-weight="normal">(x − 2)(x − 3) = 0</text><path d="M275,190 L175,225" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="181.02941683724134,218.31822384370813 175,225 183.88022858270253,226.46340025931153" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M365,190 L465,225" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="456.11977141729744,226.46340025931153 465,225 458.97058316275866,218.31822384370813" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="90" y="230" width="170" height="64" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><rect x="380" y="230" width="170" height="64" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="175" y="270" font-size="24" fill="#193e36" text-anchor="middle" font-weight="normal">x = 2</text><text x="465" y="270" font-size="24" fill="#193e36" text-anchor="middle" font-weight="normal">x = 3</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
