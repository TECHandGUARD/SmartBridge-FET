<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Factorise, solve, check</title><desc id="desc">x squared minus 5x plus 6 equals zero becomes (x minus 2)(x minus 3) equals zero. Arrows split to the roots x equals 2 and x equals 3.</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="130" y="15" width="380" height="64" rx="12" fill="#e6efe8"/><text x="320" y="55" font-size="24" fill="#173d34" text-anchor="middle" font-weight="normal">x² − 5x + 6 = 0</text><path d="M320,85 L320,115" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="315.6851701525622,107.10175694298664 320,115 324.3148298474378,107.10175694298664" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="130" y="120" width="380" height="64" rx="12" fill="#e6efe8"/><text x="320" y="160" font-size="24" fill="#173d34" text-anchor="middle" font-weight="normal">(x − 2)(x − 3) = 0</text><path d="M275,190 L175,225" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="181.02941683724134,218.31822384370813 175,225 183.88022858270253,226.46340025931153" stroke="#2d8068" stroke-width="3" fill="none"/><path d="M365,190 L465,225" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="456.11977141729744,226.46340025931153 465,225 458.97058316275866,218.31822384370813" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="90" y="230" width="170" height="64" rx="12" fill="#e6efe8"/><rect x="380" y="230" width="170" height="64" rx="12" fill="#e6efe8"/><text x="175" y="270" font-size="24" fill="#173d34" text-anchor="middle" font-weight="normal">x = 2</text><text x="465" y="270" font-size="24" fill="#173d34" text-anchor="middle" font-weight="normal">x = 3</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 10 · Mathematics</text></g></svg>