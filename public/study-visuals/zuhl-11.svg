<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Hlaziya ulimi lokunxenxa</title><desc id="desc">Isikhangiso sokuqala: “Masivikele umtapo wethu wezincwadi. Letha incwadi ngoMgqibelo. Incwadi eyodwa ivula iminyango eminingi.”. wethu, ukufaka wonke umuntu, umuzwa wobunye. masivikele, ukubiza abantu esenzweni, ukuzibophezela. iminyango eminingi, ulimi olungokomfanekiso, amathuba amaningi</desc><defs>
