<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Use development indicators critically</title><desc id="desc">In the invented dataset, 70 percent of Place A and 95 percent of Place B have access to safe water. Bars compare this social indicator, not overall development.</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="25" y="30" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Invented data · access to safe water</text><text x="25" y="80" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Water access A</text><rect x="25" y="94" width="324.2105263157895" height="39" rx="12" fill="#2d8068"/><text x="480" y="120" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">70%</text><text x="25" y="180" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Water access B</text><rect x="25" y="194" width="440.0" height="39" rx="12" fill="#386a98"/><text x="480" y="220" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">95%</text><text x="25" y="305" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Compare the same measure, period and units.</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 11 · Geography</text></g></svg>