<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Oorreding en kritiese taalbewustheid</title><desc id="desc">Oorspronklike plakkaat: “Moenie ons biblioteek laat verdwyn nie. Skenk Saterdag ’n boek. Een boek maak honderd deure oop.”. ons, inklusiewe taal, gedeelde verantwoordelikheid. verdwyn, emotiewe taal, vrees vir verlies. honderd deure, beeldspraak, baie geleenthede</desc><defs>
