<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Yakha umhlathi wohlalutyo loncwadi</title><desc id="desc">Umbongo wokuqala: “Ndiyasonga imephu. / Indlela isavulekile. / Ngaphaya kwesango / kusasa kundilindile.”. imephu iyasongwa, ukulungiselela kuyaphela, isenzo sesithethi. indlela ivulekile, amathuba asekhona, uhambo alukapheli. kusasa kuyalinda, ithemba ngekamva, isimntwiso</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="20" y="16" width="225" height="79" rx="12" fill="#f2e4c5"/><text x="37" y="43" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">“imephu iyasongwa”</text><path d="M255,55 L297,55" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="289.10175694298664,59.31482984743783 297,55 289.10175694298664,50.68517015256217" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="310" y="16" width="310" height="79" rx="12" fill="#e6efe8"/><text x="326" y="41" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">ukulungiselela kuyaphela</text><text x="326" y="66" font-size="13" fill="#173d34" text-anchor="start" font-weight="normal">isenzo sesithethi</text><rect x="20" y="117" width="225" height="79" rx="12" fill="#f2e4c5"/><text x="37" y="144" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">“indlela ivulekile”</text><path d="M255,156 L297,156" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="289.10175694298664,160.31482984743784 297,156 289.10175694298664,151.68517015256216" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="310" y="117" width="310" height="79" rx="12" fill="#e6efe8"/><text x="326" y="142" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">amathuba asekhona</text><text x="326" y="167" font-size="13" fill="#173d34" text-anchor="start" font-weight="normal">uhambo alukapheli</text><rect x="20" y="218" width="225" height="79" rx="12" fill="#f2e4c5"/><text x="37" y="245" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">“kusasa kuyalinda”</text><path d="M255,257 L297,257" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="289.10175694298664,261.3148298474378 297,257 289.10175694298664,252.68517015256216" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="310" y="218" width="310" height="79" rx="12" fill="#e6efe8"/><text x="326" y="243" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">ithemba ngekamva</text><text x="326" y="268" font-size="13" fill="#173d34" text-anchor="start" font-weight="normal">isimntwiso</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 12 · isiXhosa HL</text></g></svg>