<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Price elasticity and related markets</title><desc id="desc">Illustrative notebook market: original-value percentage method. Price, R10, R11, +10%. Quantity demanded, 100, 80, −20%. Total revenue, R1 000, R880, −12%</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="25" y="30" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Revenue = price × quantity demanded</text><text x="25" y="80" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Revenue before</text><rect x="25" y="94" width="440.0" height="39" rx="12" fill="#2d8068"/><text x="480" y="120" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">1,000</text><text x="25" y="180" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Revenue after</text><rect x="25" y="194" width="387.2" height="39" rx="12" fill="#386a98"/><text x="480" y="220" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">880</text><text x="25" y="305" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Compare the same measure, period and units.</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 11 · Economics</text></g></svg>