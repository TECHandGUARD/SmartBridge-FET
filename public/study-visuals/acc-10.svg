<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Keep the accounting equation in balance</title><desc id="desc">Assets R12 000 equal equity R10 000 plus liabilities R2 000. Coloured blocks show that the two right-hand amounts add to total assets.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">ACCOUNTING  /  GRADE 10</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Keep the accounting equation in balance</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><text x="320" y="40" font-size="25" fill="#193e36" text-anchor="middle" font-weight="normal">Assets = Equity + Liabilities</text><rect x="40" y="80" width="560" height="70" rx="13" fill="url(#forest)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="320" y="124" font-size="25" fill="white" text-anchor="middle" font-weight="normal">Assets R12 000</text><rect x="40" y="180" width="390" height="70" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><rect x="445" y="180" width="155" height="70" rx="13" fill="#f1dfbd" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="235" y="222" font-size="23" fill="#193e36" text-anchor="middle" font-weight="normal">Equity R10 000</text><text x="522" y="222" font-size="21" fill="#193e36" text-anchor="middle" font-weight="normal">R2 000</text><text x="522" y="278" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">Liabilities</text><text x="235" y="278" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">Owner’s interest</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
 <text x="40" y="506" font-size="10" fill="#52675e" text-anchor="start" font-weight="bold">SMARTBRIDGE FET</text>
 <text x="760" y="506" font-size="10" fill="#52675e" text-anchor="end" font-weight="normal">VISUAL NOTES  /  ACC-10</text>
 </g></svg>