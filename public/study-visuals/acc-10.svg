<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Keep the accounting equation in balance</title><desc id="desc">A new business: transaction effects. Owner invests R10 000, +10 000, +10 000, 0. Buy equipment for R3 000 cash, 0 net, 0, 0. Borrow R2 000, +2 000, 0, +2 000</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="320" y="40" font-size="25" fill="#173d34" text-anchor="middle" font-weight="normal">Assets = Equity + Liabilities</text><rect x="40" y="80" width="560" height="70" rx="12" fill="#2d8068"/><text x="320" y="124" font-size="25" fill="white" text-anchor="middle" font-weight="normal">Assets R12 000</text><rect x="40" y="180" width="390" height="70" rx="12" fill="#e6efe8"/><rect x="445" y="180" width="155" height="70" rx="12" fill="#f1dfbd"/><text x="235" y="222" font-size="23" fill="#173d34" text-anchor="middle" font-weight="normal">Equity R10 000</text><text x="522" y="222" font-size="21" fill="#173d34" text-anchor="middle" font-weight="normal">R2 000</text><text x="522" y="278" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">Liabilities</text><text x="235" y="278" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">Owner’s interest</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 10 · Accounting</text></g></svg>