<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Monohybrid inheritance</title><desc id="desc">Each parent supplies T or t. Four equally likely cells show TT, Tt, Tt and tt. Under the stated dominant model, tall offspring have probability three quarters and short offspring one quarter.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">LIFE SCIENCES  /  GRADE 12</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Monohybrid inheritance</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><text x="320" y="28" font-size="24" fill="#193e36" text-anchor="middle" font-weight="normal">Tt × Tt</text><text x="280" y="70" font-size="22" fill="#193e36" text-anchor="middle" font-weight="normal">T</text><text x="155" y="120" font-size="22" fill="#193e36" text-anchor="middle" font-weight="normal">T</text><text x="395" y="70" font-size="22" fill="#193e36" text-anchor="middle" font-weight="normal">t</text><text x="155" y="210" font-size="22" fill="#193e36" text-anchor="middle" font-weight="normal">t</text><rect x="225" y="85" width="105" height="80" rx="13" fill="#e1ebcf" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="277" y="134" font-size="25" fill="#193e36" text-anchor="middle" font-weight="normal">TT</text><rect x="340" y="85" width="105" height="80" rx="13" fill="#e1ebcf" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="392" y="134" font-size="25" fill="#193e36" text-anchor="middle" font-weight="normal">Tt</text><rect x="225" y="175" width="105" height="80" rx="13" fill="#e1ebcf" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="277" y="224" font-size="25" fill="#193e36" text-anchor="middle" font-weight="normal">Tt</text><rect x="340" y="175" width="105" height="80" rx="13" fill="#f4dfbb" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="392" y="224" font-size="25" fill="#193e36" text-anchor="middle" font-weight="normal">tt</text><text x="320" y="300" font-size="17" fill="#193e36" text-anchor="middle" font-weight="normal">Tall: 3/4 · Short: 1/4 (probabilities, not promises)</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
 <text x="40" y="506" font-size="10" fill="#52675e" text-anchor="start" font-weight="bold">SMARTBRIDGE FET</text>
 <text x="760" y="506" font-size="10" fill="#52675e" text-anchor="end" font-weight="normal">VISUAL NOTES  /  LISC-12</text>
 </g></svg>