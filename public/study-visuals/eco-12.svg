<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Interpret the multiplier</title><desc id="desc">An initial R100 spending injection with MPC = 0.8. 1, R100, R100. 2, R80, R180. 3, R64, R244. All rounds, decreasing amounts, approaches R500</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">ECONOMICS  /  GRADE 12</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Interpret the multiplier</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><text x="25" y="21" font-size="15" fill="#193e36" text-anchor="start" font-weight="normal">MPC = 0.8  /  each round spends 80% of the previous one</text><rect x="44" y="82.0" width="123" height="165.0" rx="13" fill="url(#forest)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="105" y="67.0" font-size="21" fill="#193e36" text-anchor="middle" font-weight="normal">R100</text><text x="105" y="274" font-size="14" fill="#193e36" text-anchor="middle" font-weight="normal">Round 1</text><path d="M178,150 L208,150" stroke="#a97936" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="200.10175694298664,154.31482984743784 208,150 200.10175694298664,145.68517015256216" stroke="#a97936" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="221" y="115.0" width="123" height="132.0" rx="13" fill="#3c718c" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="282" y="100.0" font-size="21" fill="#193e36" text-anchor="middle" font-weight="normal">R80</text><text x="282" y="274" font-size="14" fill="#193e36" text-anchor="middle" font-weight="normal">Round 2</text><path d="M355,150 L385,150" stroke="#a97936" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="377.10175694298664,154.31482984743784 385,150 377.10175694298664,145.68517015256216" stroke="#a97936" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="398" y="141.4" width="123" height="105.6" rx="13" fill="url(#brass)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="459" y="126.4" font-size="21" fill="#193e36" text-anchor="middle" font-weight="normal">R64</text><text x="459" y="274" font-size="14" fill="#193e36" text-anchor="middle" font-weight="normal">Round 3</text><path d="M25,247 L596,247" stroke="#8da597" stroke-width="1" stroke-linecap="round" fill="none"/><text x="320" y="310" font-size="18" fill="#193e36" text-anchor="middle" font-weight="normal">All rounds: total spending approaches R500</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
