<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Atmosphere: explain heating</title><desc id="desc">Sunlight travels down to Earth as shortwave radiation. The surface emits infrared upward. A simplified atmosphere layer re-emits some infrared back toward the surface.</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><circle cx="90" cy="63" r="35" fill="#efcb70"/><text x="90" y="69" font-size="18" fill="#173d34" text-anchor="middle" font-weight="normal">Sun</text><rect x="50" y="250" width="540" height="30" rx="12" fill="#2d8068"/><text x="320" y="305" font-size="18" fill="#173d34" text-anchor="middle" font-weight="normal">Earth’s surface</text><path d="M130,90 L235,245" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="226.99795675440535,240.88086126773652 235,245 234.14261330834677,236.04093263442138" stroke="#a86b26" stroke-width="3" fill="none"/><text x="110" y="175" font-size="16" fill="#173d34" text-anchor="start" font-weight="normal">Shortwave</text><path d="M340,245 L340,70" stroke="#386a98" stroke-width="3" fill="none"/><polyline points="344.3148298474378,77.89824305701336 340,70 335.6851701525622,77.89824305701336" stroke="#386a98" stroke-width="3" fill="none"/><text x="355" y="100" font-size="16" fill="#173d34" text-anchor="start" font-weight="normal">Infrared</text><path d="M45,150 L595,150" stroke="#9ab7cb" stroke-width="8" fill="none"/><text x="445" y="177" font-size="16" fill="#173d34" text-anchor="start" font-weight="normal">Atmosphere</text><path d="M400,155 L460,240" stroke="#386a98" stroke-width="3" fill="none"/><polyline points="451.92013861765787,236.03567911968062 460,240 458.97029325928247,231.0590993726515" stroke="#386a98" stroke-width="3" fill="none"/><text x="453" y="220" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Re-emitted</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 10 · Geography</text></g></svg>