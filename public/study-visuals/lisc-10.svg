<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Cells: structure explains function</title><desc id="desc">Compare structures, not just outlines. Cell membrane, present, present. Cellulose cell wall, present, absent. Chloroplasts, in photosynthetic cells, absent. Mitochondria, present, present</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="110" y="26" width="285" height="230" rx="12" fill="#c1d9ac"/><rect x="122" y="38" width="261" height="206" rx="12" fill="#eaf3d9"/><rect x="205" y="70" width="140" height="130" rx="12" fill="#cbe0ef"/><circle cx="167" cy="100" r="25" fill="#bcb0d3"/><circle cx="148" cy="183" r="14" fill="#2d8068"/><circle cx="355" cy="218" r="14" fill="#2d8068"/><path d="M110,52 L24,52" stroke="#a86b26" stroke-width="2" fill="none"/><text x="24" y="43" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Cell wall</text><path d="M383,60 L440,60" stroke="#a86b26" stroke-width="2" fill="none"/><text x="440" y="51" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Membrane</text><path d="M345,120 L440,120" stroke="#a86b26" stroke-width="2" fill="none"/><text x="440" y="111" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Vacuole</text><path d="M169,100 L440,180" stroke="#a86b26" stroke-width="2" fill="none"/><text x="440" y="171" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Nucleus</text><path d="M355,218 L440,240" stroke="#a86b26" stroke-width="2" fill="none"/><text x="440" y="231" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Chloroplast</text><text x="320" y="297" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">Simplified photosynthetic plant cell · not to scale</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 10 · Life Sciences</text></g></svg>