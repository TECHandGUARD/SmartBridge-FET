<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Prepare for assessments sustainably</title><desc id="desc">A repeatable revision cycle. Recall, answer a short set without notes, your first attempt. Check, compare with a memo, identify the error type. Repair, rework and explain the correction, correct reasoning. Revisit, try again after a gap, independent recall</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><circle cx="24" cy="37.0" r="16" fill="#2d8068"/><text x="24" y="43.0" font-size="16" fill="white" text-anchor="middle" font-weight="bold">1</text><rect x="54" y="15.0" width="554" height="63.0" rx="12" fill="#e6efe8"/><text x="70" y="39.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Recall</text><path d="M278,42.0 L300,42.0" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="292.10175694298664,46.31482984743783 300,42.0 292.10175694298664,37.68517015256217" stroke="#a86b26" stroke-width="3" fill="none"/><text x="320" y="39.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">answer a short set without notes</text><text x="320" y="59.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">· your first attempt</text><path d="M24,54.0 L24,90.0" stroke="#a86b26" stroke-width="2" fill="none"/><circle cx="24" cy="114.0" r="16" fill="#2d8068"/><text x="24" y="120.0" font-size="16" fill="white" text-anchor="middle" font-weight="bold">2</text><rect x="54" y="92.0" width="554" height="63.0" rx="12" fill="#e6efe8"/><text x="70" y="116.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Check</text><path d="M278,119.0 L300,119.0" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="292.10175694298664,123.31482984743782 300,119.0 292.10175694298664,114.68517015256218" stroke="#a86b26" stroke-width="3" fill="none"/><text x="320" y="116.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">compare with a memo · identify</text><text x="320" y="136.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">the error type</text><path d="M24,131.0 L24,167.0" stroke="#a86b26" stroke-width="2" fill="none"/><circle cx="24" cy="191.0" r="16" fill="#2d8068"/><text x="24" y="197.0" font-size="16" fill="white" text-anchor="middle" font-weight="bold">3</text><rect x="54" y="169.0" width="554" height="63.0" rx="12" fill="#e6efe8"/><text x="70" y="193.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Repair</text><path d="M278,196.0 L300,196.0" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="292.10175694298664,200.31482984743784 300,196.0 292.10175694298664,191.68517015256216" stroke="#a86b26" stroke-width="3" fill="none"/><text x="320" y="193.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">rework and explain the correction</text><text x="320" y="213.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">· correct reasoning</text><path d="M24,208.0 L24,244.0" stroke="#a86b26" stroke-width="2" fill="none"/><circle cx="24" cy="268.0" r="16" fill="#2d8068"/><text x="24" y="274.0" font-size="16" fill="white" text-anchor="middle" font-weight="bold">4</text><rect x="54" y="246.0" width="554" height="63.0" rx="12" fill="#e6efe8"/><text x="70" y="270.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Revisit</text><path d="M278,273.0 L300,273.0" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="292.10175694298664,277.3148298474378 300,273.0 292.10175694298664,268.6851701525622" stroke="#a86b26" stroke-width="3" fill="none"/><text x="320" y="270.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">try again after a gap ·</text><text x="320" y="290.0" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">independent recall</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 12 · Life Orientation</text></g></svg>