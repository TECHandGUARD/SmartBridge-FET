<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Motion in one dimension</title><desc id="desc">A walker goes 4 metres east, then 4 metres west to the start. Opposing arrows show the two legs. Total distance is 8 metres; displacement is zero.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">PHYSICAL SCIENCES  /  GRADE 10</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Motion in one dimension</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><text x="320" y="30" font-size="18" fill="#193e36" text-anchor="middle" font-weight="normal">Same start and finish. Different total distance.</text><path d="M95,175 L545,175" stroke="#a97936" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="110" cy="175" r="12" fill="#347864"/><circle cx="530" cy="175" r="12" fill="#347864"/><text x="110" y="220" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">Start / finish</text><text x="530" y="220" font-size="16" fill="#193e36" text-anchor="middle" font-weight="normal">4 m east</text><path d="M120,95 L520,95" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="512.1017569429866,99.31482984743782 520,95 512.1017569429866,90.68517015256218" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="320" y="78" font-size="17" fill="#193e36" text-anchor="middle" font-weight="normal">Outward: 4 m east</text><path d="M520,140 L120,140" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="127.89824305701336,135.68517015256216 120,140 127.89824305701336,144.31482984743784" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="320" y="128" font-size="17" fill="#193e36" text-anchor="middle" font-weight="normal">Return: 4 m west</text><text x="320" y="272" font-size="21" fill="#193e36" text-anchor="middle" font-weight="normal">Distance = 8 m</text><text x="320" y="305" font-size="21" fill="#193e36" text-anchor="middle" font-weight="normal">Displacement = 0 m</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
 <text x="40" y="506" font-size="10" fill="#52675e" text-anchor="start" font-weight="bold">SMARTBRIDGE FET</text>
 <text x="760" y="506" font-size="10" fill="#52675e" text-anchor="end" font-weight="normal">VISUAL NOTES  /  PHSC-10</text>
 </g></svg>