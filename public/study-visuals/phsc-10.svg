<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Motion in one dimension</title><desc id="desc">A walker returns towards the start; east is positive. 0, 0, —. 2, 4, +2 m·s⁻¹. 4, 0, −2 m·s⁻¹</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="320" y="30" font-size="18" fill="#173d34" text-anchor="middle" font-weight="normal">Same start and finish. Different total distance.</text><path d="M95,175 L545,175" stroke="#a86b26" stroke-width="4" fill="none"/><circle cx="110" cy="175" r="12" fill="#2d8068"/><circle cx="530" cy="175" r="12" fill="#2d8068"/><text x="110" y="220" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">Start / finish</text><text x="530" y="220" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">4 m east</text><path d="M120,95 L520,95" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="512.1017569429866,99.31482984743782 520,95 512.1017569429866,90.68517015256218" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="78" font-size="17" fill="#173d34" text-anchor="middle" font-weight="normal">Outward: 4 m east</text><path d="M520,140 L120,140" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="127.89824305701336,135.68517015256216 120,140 127.89824305701336,144.31482984743784" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="128" font-size="17" fill="#173d34" text-anchor="middle" font-weight="normal">Return: 4 m west</text><text x="320" y="272" font-size="21" fill="#173d34" text-anchor="middle" font-weight="normal">Distance = 8 m</text><text x="320" y="305" font-size="21" fill="#173d34" text-anchor="middle" font-weight="normal">Displacement = 0 m</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 10 · Physical Sciences</text></g></svg>