<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Read a river’s long profile</title><desc id="desc">Simplified downstream pattern. Upper course, steeper, vertical erosion. Middle course, moderate, transport and lateral erosion. Lower course, gentler, deposition where carrying capacity falls</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><polyline points="55,65 120,125 210,175 310,212 450,237 580,248" stroke="#386a98" stroke-width="7" fill="none"/><path d="M50,280 L600,280" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="592.1017569429866,284.3148298474378 600,280 592.1017569429866,275.6851701525622" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="310" font-size="18" fill="#173d34" text-anchor="middle" font-weight="normal">Downstream →</text><text x="60" y="35" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Upper</text><text x="60" y="59" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Steeper gradient</text><text x="240" y="140" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Middle</text><text x="240" y="164" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Moderate gradient</text><text x="430" y="200" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Lower</text><text x="430" y="224" font-size="14" fill="#173d34" text-anchor="start" font-weight="normal">Gentler gradient</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 12 · Geography</text></g></svg>