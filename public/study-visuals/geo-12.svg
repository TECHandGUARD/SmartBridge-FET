<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Read a river’s long profile</title><desc id="desc">A downstream curve begins steep in the upper course, becomes moderate in the middle course and gentle in the lower course. A horizontal arrow marks downstream direction.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">GEOGRAPHY  /  GRADE 12</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Read a river’s long profile</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><polyline points="55,65 120,125 210,175 310,212 450,237 580,248" stroke="#3c718c" stroke-width="7" fill="none"/><path d="M50,280 L600,280" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="592.1017569429866,284.3148298474378 600,280 592.1017569429866,275.6851701525622" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="320" y="310" font-size="18" fill="#193e36" text-anchor="middle" font-weight="normal">Downstream →</text><text x="60" y="35" font-size="19" fill="#193e36" text-anchor="start" font-weight="normal">Upper</text><text x="60" y="59" font-size="14" fill="#193e36" text-anchor="start" font-weight="normal">Steeper gradient</text><text x="240" y="140" font-size="19" fill="#193e36" text-anchor="start" font-weight="normal">Middle</text><text x="240" y="164" font-size="14" fill="#193e36" text-anchor="start" font-weight="normal">Moderate gradient</text><text x="430" y="200" font-size="19" fill="#193e36" text-anchor="start" font-weight="normal">Lower</text><text x="430" y="224" font-size="14" fill="#193e36" text-anchor="start" font-weight="normal">Gentler gradient</text></g>
 <path d="M40 484H760" stroke="#c6d0c0" stroke-width=".8"/>
 <text x="40" y="506" font-size="10" fill="#52675e" text-anchor="start" font-weight="bold">SMARTBRIDGE FET</text>
 <text x="760" y="506" font-size="10" fill="#52675e" text-anchor="end" font-weight="normal">VISUAL NOTES  /  GEO-12</text>
 </g></svg>