<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Follow the circular flow</title><desc id="desc">Two markets connect households and firms. Factor market, households → firms: labour, firms → households: wages. Goods market, firms → households: products, households → firms: spending</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="35" y="110" width="180" height="85" rx="12" fill="#e6efe8"/><rect x="425" y="110" width="180" height="85" rx="12" fill="#e6efe8"/><text x="125" y="162" font-size="22" fill="#173d34" text-anchor="middle" font-weight="normal">Households</text><text x="515" y="162" font-size="22" fill="#173d34" text-anchor="middle" font-weight="normal">Firms</text><path d="M225,50 L415,50" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="407.10175694298664,54.31482984743783 415,50 407.10175694298664,45.68517015256217" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="38" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">Labour →</text><path d="M415,90 L225,90" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="232.89824305701336,85.68517015256216 225,90 232.89824305701336,94.31482984743782" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="78" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">← Wages</text><path d="M415,225 L225,225" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="232.89824305701336,220.68517015256216 225,225 232.89824305701336,229.31482984743784" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="213" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">← Goods</text><path d="M225,280 L415,280" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="407.10175694298664,284.3148298474378 415,280 407.10175694298664,275.6851701525622" stroke="#2d8068" stroke-width="3" fill="none"/><text x="320" y="268" font-size="16" fill="#173d34" text-anchor="middle" font-weight="normal">Spending →</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 10 · Economics</text></g></svg>