<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Time zones without guesswork</title><desc id="desc">Worked route with stated offsets. Depart Johannesburg UTC+2, 22:00 − 2 h, 20:00 UTC. Fly 10 hours, 20:00 + 10 h, 06:00 UTC next day. Destination UTC+1, 06:00 + 1 h, 07:00 local next day</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="25" y="25" width="590" height="65" rx="12" fill="#e6efe8"/><text x="48" y="53" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Johannesburg · UTC+2</text><text x="48" y="77" font-size="17" fill="#173d34" text-anchor="start" font-weight="normal">Monday 22:00 local → Monday 20:00 UTC</text><path d="M320,98 L320,130" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="315.6851701525622,122.10175694298664 320,130 324.3148298474378,122.10175694298664" stroke="#a86b26" stroke-width="3" fill="none"/><text x="345" y="119" font-size="16" fill="#173d34" text-anchor="start" font-weight="normal">+10 hours flying</text><rect x="25" y="140" width="590" height="65" rx="12" fill="#e6efe8"/><text x="48" y="180" font-size="23" fill="#173d34" text-anchor="start" font-weight="normal">Tuesday 06:00 UTC</text><path d="M320,213 L320,242" stroke="#a86b26" stroke-width="3" fill="none"/><polyline points="315.6851701525622,234.10175694298664 320,242 324.3148298474378,234.10175694298664" stroke="#a86b26" stroke-width="3" fill="none"/><text x="345" y="233" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">+1 hour at destination</text><rect x="25" y="250" width="590" height="65" rx="12" fill="#e6efe8"/><text x="48" y="289" font-size="22" fill="#173d34" text-anchor="start" font-weight="normal">Tuesday 07:00 local · UTC+1</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 12 · Tourism</text></g></svg>