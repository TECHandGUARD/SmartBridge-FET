<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Forces and Newton’s second law</title><desc id="desc">Simplified force diagram, not drawn to force scale: a 5 kilogram crate has normal force 49 newtons up, weight 49 newtons down, pull 20 newtons right and friction 5 newtons left. The horizontal resultant is 15 newtons right.</desc><defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f2f3ec"/></linearGradient>
 <linearGradient id="forest" x2=".8" y2="1"><stop stop-color="#3d806b"/><stop offset="1" stop-color="#183f35"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#e0eadd"/></linearGradient>
 <linearGradient id="brass" x2="1" y2="1"><stop stop-color="#c7a36a"/><stop offset="1" stop-color="#98703b"/></linearGradient>
 <linearGradient id="cell" x2="1" y2="1"><stop stop-color="#d7e6bf"/><stop offset="1" stop-color="#9cb887"/></linearGradient>
 <linearGradient id="vacuole" x2="1" y2="1"><stop stop-color="#e7f3ed"/><stop offset="1" stop-color="#b7d6df"/></linearGradient>
 <radialGradient id="nucleus" cx=".3" cy=".25"><stop stop-color="#e0d7ec"/><stop offset="1" stop-color="#a596bd"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#faf0c6"/><stop offset="1" stop-color="#e6c77c"/></radialGradient>
 <linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9dbb74"/><stop offset=".6" stop-color="#5f9361"/><stop offset="1" stop-color="#35694f"/></linearGradient>
 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8fa491" opacity=".18"/></pattern>
</defs>
 <rect width="800" height="520" rx="0" fill="url(#paper)"/>
 <path d="M600 0H800V190C718 156 654 86 600 0Z" fill="#e4ebe1" opacity=".55"/>
 <rect x="20" y="122" width="760" height="350" rx="18" fill="url(#dots)"/>
 <g font-family="DejaVu Sans,Arial,sans-serif">
 <text x="40" y="36" font-size="11" fill="#52675e" text-anchor="start" font-weight="bold">PHYSICAL SCIENCES  /  GRADE 11</text>
 <path d="M704 24H760M732 10V38" stroke="#ae8a50" stroke-width="1" opacity=".65"/>
 <g font-family="Georgia,DejaVu Serif,serif"><text x="40" y="79" font-size="23" fill="#193e36" text-anchor="start" font-weight="normal">Forces and Newton’s second law</text></g>
 <path d="M40 116H760" stroke="#c6d0c0" stroke-width=".8"/>
 <g transform="translate(64 132) scale(1.05)"><rect x="260" y="120" width="120" height="80" rx="13" fill="url(#sage)" stroke="#193e36" stroke-opacity=".13" stroke-width=".8"/><text x="320" y="168" font-size="22" fill="#193e36" text-anchor="middle" font-weight="normal">5 kg</text><path d="M320,120 L320,30" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="324.3148298474378,37.89824305701335 320,30 315.6851701525622,37.89824305701335" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="338" y="47" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Normal 49 N</text><path d="M320,200 L320,280" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="315.6851701525622,272.10175694298664 320,280 324.3148298474378,272.10175694298664" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="338" y="277" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Weight 49 N</text><path d="M260,160 L175,160" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="182.89824305701336,155.68517015256216 175,160 182.89824305701336,164.31482984743784" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="63" y="140" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Friction 5 N</text><path d="M380,160 L550,160" stroke="#347864" stroke-width="2.1" stroke-linecap="round" fill="none"/><polyline points="542.1017569429866,164.31482984743784 550,160 542.1017569429866,155.68517015256216" stroke="#347864" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="430" y="140" font-size="16" fill="#193e36" text-anchor="start" font-weight="normal">Pull 20 N</text><text x="320" y="315" font-size="17" fill="#193e36" text-anchor="middle" font-weight="normal">Horizontal net force: 20 − 5 = 15 N right</text></g>
