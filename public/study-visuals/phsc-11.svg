20 N</text><text x="320" y="315" font-size="17" fill="#173d34" text-anchor="middle" font-weight="normal">Horizontal net force: 20 − 5 = 15 N right</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 11 · Physical Sciences</text></g></svg>