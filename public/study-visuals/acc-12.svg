<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Use ratios to explain performance</title><desc id="desc">Illustrative company information. Sales, R500 000, margin denominator. Cost of sales, R300 000, gross profit calculation. Current assets, R120 000, includes R40 000 inventory. Current liabilities, R60 000, liquidity denominator</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="320" y="35" font-size="23" fill="#173d34" text-anchor="middle" font-weight="normal">Sales: R500 000</text><rect x="45" y="70" width="330" height="70" rx="12" fill="#2d8068"/><rect x="375" y="70" width="220" height="70" rx="12" fill="#a86b26"/><text x="210" y="110" font-size="19" fill="white" text-anchor="middle" font-weight="normal">Cost: R300 000</text><text x="485" y="110" font-size="17" fill="white" text-anchor="middle" font-weight="normal">GP: R200 000</text><path d="M485,150 L485,205" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="480.6851701525622,197.10175694298664 485,205 489.3148298474378,197.10175694298664" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="320" y="215" width="285" height="70" rx="12" fill="#e6efe8"/><text x="462" y="257" font-size="22" fill="#173d34" text-anchor="middle" font-weight="normal">GP margin = 40%</text><text x="25" y="305" font-size="19" fill="#173d34" text-anchor="start" font-weight="normal">Gross profit ÷ sales × 100</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 12 · Accounting</text></g></svg>