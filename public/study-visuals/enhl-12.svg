<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Build a defensible literary paragraph</title><desc id="desc">Original poem: “I fold the map. / The road remains. / Beyond the gate, / the morning waits.”. fold the map, less reliance on planning, an action ends preparation. road remains, uncertainty continues, contrast with folded map. morning waits, new possibility, personification and open ending</desc><rect width="640" height="380" rx="18" fill="#faf9f4"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="20" y="16" width="225" height="79" rx="12" fill="#f2e4c5"/><text x="37" y="43" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">“fold the map”</text><path d="M255,55 L297,55" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="289.10175694298664,59.31482984743783 297,55 289.10175694298664,50.68517015256217" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="310" y="16" width="310" height="79" rx="12" fill="#e6efe8"/><text x="326" y="41" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">less reliance on planning</text><text x="326" y="66" font-size="13" fill="#173d34" text-anchor="start" font-weight="normal">an action ends preparation</text><rect x="20" y="117" width="225" height="79" rx="12" fill="#f2e4c5"/><text x="37" y="144" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">“road remains”</text><path d="M255,156 L297,156" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="289.10175694298664,160.31482984743784 297,156 289.10175694298664,151.68517015256216" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="310" y="117" width="310" height="79" rx="12" fill="#e6efe8"/><text x="326" y="142" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">uncertainty continues</text><text x="326" y="167" font-size="13" fill="#173d34" text-anchor="start" font-weight="normal">contrast with folded map</text><rect x="20" y="218" width="225" height="79" rx="12" fill="#f2e4c5"/><text x="37" y="245" font-size="18" fill="#173d34" text-anchor="start" font-weight="normal">“morning waits”</text><path d="M255,257 L297,257" stroke="#2d8068" stroke-width="3" fill="none"/><polyline points="289.10175694298664,261.3148298474378 297,257 289.10175694298664,252.68517015256216" stroke="#2d8068" stroke-width="3" fill="none"/><rect x="310" y="218" width="310" height="79" rx="12" fill="#e6efe8"/><text x="326" y="243" font-size="15" fill="#173d34" text-anchor="start" font-weight="normal">new possibility</text><text x="326" y="268" font-size="13" fill="#173d34" text-anchor="start" font-weight="normal">personification and open ending</text><text x="25" y="361" font-size="12" fill="#52675e" text-anchor="start" font-weight="normal">SmartBridge FET · Grade 12 · English HL</text></g></svg>