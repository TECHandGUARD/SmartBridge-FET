name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://smartbridge-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check:mobile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python tests/test_call_relay.py
      - run: npm run check:db
      - run: npm run check:api
      - run: npm run check:edge
      - run: npm run prepare:edge -- /tmp/verified-edge
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:content
      - run: npm run test:e2e:opportunities
      - run: npm run test:e2e:staff
      - run: npm run test:e2e:payments
      - run: npm run test:e2e:drafts
      - run: npm run test:e2e:presentations
      - run: npm run test:e2e:meetings
      - run: npm run test:e2e:live
      - run: npm run test:e2e:config
      - run: npm run test:e2e:audit
      - run: npm run test:e2e:tutors
      - run: npm run test:e2e:lab
      - run: npm run test:e2e:sponsorship
      - run: npm run test:e2e:messages
      - name: Save classroom and meeting visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-space-visual-checks
          path: /tmp/premium-*.png
          if-no-files-found: ignore
          retention-days: 7
  supabase-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: npm ci --include=dev
      - run: node tests/local-supabase-services.cjs
  encrypted-relay:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::741180449622:role/SmartBridgeRelayTestRole
          aws-region: eu-west-1
      - name: Obtain ephemeral relay credentials and verify actual media
        env:
          SMARTBRIDGE_RELAY_CONFIG_PATH: /tmp/smartbridge-relay.json
        run: |
          aws lambda invoke --function-name smartbridge-call-relay --payload '{"deployment_check":true,"room_id":"00000000-0000-4000-8000-000000000001","actor_id":"00000000-0000-4000-8000-000000000002"}' --cli-binary-format raw-in-base64-out /tmp/smartbridge-relay.json > /dev/null
          node tests/browser-virtual-meetings.cjs
          aws lambda invoke --function-name smartbridge-call-relay --payload '{"deployment_check":true,"room_id":"00000000-0000-4000-8000-000000000003","actor_id":"00000000-0000-4000-8000-000000000004"}' --cli-binary-format raw-in-base64-out /tmp/smartbridge-relay.json > /dev/null
          node tests/browser-live-classroom.cjs
      - if: always()
        run: rm -f /tmp/smartbridge-relay.json
